# Tag-push release (mw-der3): v* tag → binaries for the support matrix →
# GitHub Release. Consumers never `cargo install` globally — each repo pins a
# tag in .meshwork-version and installs to ~/.meshwork/versions/<tag>/ (DESIGN,
# adoption skill). Matrix added by mw-k5fc (native builds per runner, still no
# cross-compile); cargo caching by mw-z0vh (shared-key caches are saved on main
# by warm-cache.yml — tag refs can only restore caches from their own ref or
# the default branch, so without the warmer every tag build is cold).
name: release
on:
  push:
    tags: ["v*"]
  # Manual re-fire against an existing tag (gh workflow run release --ref vX.Y.Z)
  # — added 2026-08-06 when outage-throttled webhooks swallowed tag pushes;
  # GITHUB_REF_NAME resolves identically either way. Only works for tags whose
  # tree contains this trigger.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Create the release once, with the target-independent skill tarball, so the
  # per-target upload jobs never race each other on `gh release create`.
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 — pin by known-good SHA, never tag
      - name: package skill
        run: |
          mkdir -p dist
          tar -czf "dist/meshwork-skill-${GITHUB_REF_NAME}.tar.gz" \
            -C .claude/skills meshwork
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "meshwork ${GITHUB_REF_NAME}" \
              --notes "darwin arm64, linux arm64/x86_64, windows x86_64. Pin: put ${GITHUB_REF_NAME} in .meshwork-version; install to ~/.meshwork/versions/${GITHUB_REF_NAME}/ (see the meshwork adoption skill)."
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
  build:
    needs: create-release
    strategy:
      fail-fast: false # one target failing must not sink the others
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 — pin by known-good SHA, never tag
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08 — arm/partner runner images ship without Rust
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 — pin by known-good SHA, never tag
        with:
          shared-key: release-${{ matrix.target }}
          # Tag builds must not write caches (they'd be unreachable from other
          # tags anyway); warm-cache.yml on main owns the writes.
          save-if: false
      - name: build
        run: cargo build --release --locked
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "dist/meshwork-${GITHUB_REF_NAME}-${{ matrix.target }}.zip" \
              ./target/release/meshwork.exe
          else
            tar -czf "dist/meshwork-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
              -C target/release meshwork
          fi
      - name: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
