[package]
name = "meshwork"
version = "0.1.1"
edition = "2021"
description = "Task graph as markdown-in-git, queried with SQL, no database. See REQUIREMENTS-meshwork.md."
license = "MIT"
publish = false

# Dep posture mirrors sahjhan (MW-J1); serde_yaml_ng replaces archived serde_yaml (REQUIREMENTS J1 decision).
[dependencies]
clap = { version = "4", features = ["derive"] }
datafusion = "51"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Baseline hard mode: manifest lints stay warn-heavy so mid-TDD builds pass;
# warnings-as-errors lives in the gates (verify_meshwork.sh §2).
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
